#
# [[tier]]
# name = "sonar"
# provider = "perplexity"         # live web search answers, never cached
# model = "sonar-pro"

[[tier]]
name = "opus"
provider = "anthropic"
model = "claude-opus-5-5"         # $4 / $20; cache reads cost 5% of input

[router]
# The bundled routers were certified on other models. Until you calibrate on your own
# traffic (`thrift-llm calibrate`), the drift guard below is what keeps routing honest.
enabled = true

[shadow]
rate = 0.10

[drift]
alpha = 0.05
judge = "llm"
action = "safe_mode"

[prices]
# "<model id>" = [input, output]  # USD per 1M tokens
